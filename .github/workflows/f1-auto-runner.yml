name: F1 Auto Runner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Prevent overlapping runs if one cycle takes longer than 15 minutes.
# cancel-in-progress: false lets the active run finish rather than being killed.
concurrency:
  group: f1-auto-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    # Required for the bot commit push step
    permissions:
      contents: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history needed so the push back doesn't fail on a shallow clone
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto runner
        run: python f1_auto_runner.py --once

      - name: Commit outputs back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only meaningful output files — never f1_cache/ (large, transient)
          git add \
            f1_auto_state.json \
            f1_2026_predicciones.csv \
            f1_2026_bayesian_priors.json \
            f1_2026_driver_profiles.json \
            f1_2026_xgb_race_model.json \
            f1_2026_lgbm_race_model.txt \
            "f1_runs/*.log" \
            "f1_runs/*.txt" \
            || true

          # Exit cleanly if nothing changed this cycle
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new data this cycle."
            exit 0
          fi

          # [skip ci] prevents this push from triggering another workflow run
          git commit -m "chore(bot): f1-auto-runner outputs [skip ci]"
          git push
